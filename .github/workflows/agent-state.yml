# Verifies the state contract on every PR.
#
# This is what actually makes the convention stick: an agent can ignore
# AGENTS.md, but it cannot ignore a red check. If a convention matters it has a
# check; without one, in two months nobody follows it.
name: agent-state

on:
  pull_request:
  push:
    branches: [main]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # No dependencies: the generator is pure stdlib on purpose.
      - name: Validate fragments and render the view
        run: python scripts/render_state.py

      # The view is generated: committing it brings back the very conflicts
      # this design exists to avoid.
      - name: Generated views must not be committed
        run: |
          for f in docs/agent/STATE.md docs/agent/log/INDEX.md; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "::error::$f is committed. Remove it from the repo and keep it gitignored."
              exit 1
            fi
          done

      # A PR that touches code and leaves no trace in the project's memory is
      # work the next agent will never find.
      #
      # The rule is defined by NEGATION on purpose: "you changed something that
      # is not documentation or configuration". That works on any folder layout
      # with no path list to configure - and a path list is exactly the kind of
      # config nobody updates, which quietly turns the check into a no-op.
      - name: Every PR with real changes leaves a record
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)

          # What does NOT count as a real change: docs, the agent state itself,
          # and root-level files such as README/LICENSE/.gitignore.
          REAL=$(echo "$CHANGED" | grep -vE '^(docs/|\.github/|[^/]*\.(md|txt|cfg|ini|toml|ya?ml|json|lock)$|\.[^/]*$)' || true)

          if [ -z "$REAL" ]; then
            echo "No code changes: no log entry required."
            exit 0
          fi

          if echo "$CHANGED" | grep -qE '^docs/agent/log/[0-9]{4}-[0-9]{2}-[0-9]{2}-.*\.md$'; then
            echo "OK: the PR includes a log entry."
            exit 0
          fi

          echo "::error::This PR changes code and adds no entry under docs/agent/log/."
          echo "Files that trigger this:"
          echo "$REAL" | sed 's/^/  - /'
          echo "See AGENTS.md, section 'Finishing a session or a PR'."
          exit 1
