# Verifica el contrato de estado en cada PR.
#
# Esto es lo que hace que la convención se cumpla de verdad: un agente puede
# ignorar AGENTS.md, pero no puede ignorar un check rojo. Si esta convención
# importa, tiene un check; si no lo tiene, en dos meses nadie la sigue.
name: agent-state

on:
  pull_request:
  push:
    branches: [main]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Sin dependencias: el generador es stdlib puro a propósito.
      - name: Validar fragments y generar la vista
        run: python scripts/render_state.py

      # La vista es generada: si alguien la commitea, vuelven los conflictos
      # que todo este diseño existe para evitar.
      - name: Las vistas generadas no se versionan
        run: |
          for f in docs/agent/STATE.md docs/agent/log/INDEX.md; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "::error::$f está versionado. Sacalo del repo y dejalo en .gitignore."
              exit 1
            fi
          done

      # Un PR que toca codigo y no deja rastro en la memoria del proyecto es
      # trabajo que el proximo agente no va a encontrar.
      #
      # La regla se define por NEGACION a proposito: "cambiaste algo que no es
      # documentacion ni configuracion". Asi funciona en cualquier estructura de
      # carpetas sin que nadie tenga que configurar una lista de rutas — que es
      # justo el tipo de configuracion que nadie actualiza y termina volviendo
      # el check inutil sin que se note.
      - name: Cada PR con cambios reales deja registro
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)

          # Lo que NO cuenta como cambio real: docs, el propio estado del
          # agente, y archivos de raiz tipo README/LICENSE/.gitignore.
          REAL=$(echo "$CHANGED" | grep -vE '^(docs/|\.github/|[^/]*\.(md|txt|cfg|ini|toml|ya?ml|json|lock)$|\.[^/]*$)' || true)

          if [ -z "$REAL" ]; then
            echo "Sin cambios de codigo: no se exige entrada de log."
            exit 0
          fi

          if echo "$CHANGED" | grep -qE '^docs/agent/log/[0-9]{4}-[0-9]{2}-[0-9]{2}-.*\.md$'; then
            echo "OK: el PR trae entrada de log."
            exit 0
          fi

          echo "::error::Este PR cambia codigo y no agrega una entrada en docs/agent/log/."
          echo "Archivos que lo disparan:"
          echo "$REAL" | sed 's/^/  - /'
          echo "Ver AGENTS.md, seccion 'Al cerrar una sesion o un PR'."
          exit 1
